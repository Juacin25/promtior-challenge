[project]
name = "promtior-challenge"
version = "0.1.0"
description = "Conversational meeting-room booking chatbot"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "streamlit",
    "bcrypt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
