name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test + coverage gate
        # Coverage flags (source, branch, fail-under=100) live in pyproject.toml,
        # so plain pytest enforces the 100% gate on business-meaningful modules.
        run: pytest
